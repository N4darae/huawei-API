openapi: 3.0.3
info:
  title: dongled
  version: 1.0.0
  description: >-
    Operations panel and customer API for a farm of Huawei E3372 HiLink dongles sold as
    SOCKS5/HTTP proxies. Customer-facing identifiers are always proxy_id, never dongle_id.
    Request bodies are capped at 1 MiB; a larger body gets a 413 response with
    error code payload_too_large.
servers:
  - url: /
tags:
  - name: auth
  - name: proxies
  - name: dongles
  - name: operations
  - name: customers
  - name: keys
  - name: events
  - name: customer-api

paths:
  /api/v1/healthz:
    get:
      tags: [events]
      operationId: healthz
      summary: Liveness plus routing and firewall invariants
      responses:
        "200":
          description: healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: an invariant is violated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: session cookie issued
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        "204":
          description: session revoked

  /api/v1/auth/session:
    get:
      tags: [auth]
      operationId: session
      responses:
        "200":
          description: current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/proxies:
    get:
      tags: [proxies]
      operationId: listProxies
      parameters:
        - name: customer_id
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProxyState"
        - name: expiring_within_days
          in: query
          required: false
          description: >-
            Keeps proxies whose expires_at is at or before now plus this many days. Already expired
            proxies are included, because they are the ones an operator most needs to see.
          schema:
            type: integer
      responses:
        "200":
          description: proxy list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyList"

  /api/v1/proxies/export:
    get:
      tags: [proxies]
      operationId: exportProxies
      description: >-
        txt emits host:port:user:pass, one proxy per line, with no trailing newline. csv emits the
        header row host,port,username,password followed by the same fields, RFC4180 quoted. A proxy
        whose auth_mode is iplist carries no credentials and is emitted as host:port in txt and with
        two empty trailing fields in csv. A userpass or both proxy whose password is missing is left
        out entirely; the count of emitted and skipped rows is returned in X-Export-Rows and
        X-Export-Skipped.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [txt, csv]
        - name: scheme
          in: query
          required: false
          schema:
            type: string
            enum: [socks5, http]
        - name: ids
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: one proxy per line as host:port:user:pass
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Export-Rows:
              schema:
                type: integer
            X-Export-Skipped:
              schema:
                type: integer
          content:
            text/plain:
              schema:
                type: string
            text/csv:
              schema:
                type: string

  /api/v1/proxies/{proxy_id}:
    get:
      tags: [proxies]
      operationId: getProxy
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      responses:
        "200":
          description: proxy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProxyDetail"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/proxies/{proxy_id}/rotate:
    post:
      tags: [proxies]
      operationId: rotateProxyAdmin
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      responses:
        "202":
          description: rotation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/OpInProgress"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/proxies/{proxy_id}/auth:
    post:
      tags: [proxies]
      operationId: setProxyAuth
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAuthRequest"
      responses:
        "202":
          description: auth change accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/OpInProgress"

  /api/v1/proxies/{proxy_id}/auth-ips:
    get:
      tags: [proxies]
      operationId: listProxyAuthIPs
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      responses:
        "200":
          description: whitelisted source networks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIPList"
    post:
      tags: [proxies]
      operationId: addProxyAuthIP
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthIPRequest"
      responses:
        "200":
          description: updated whitelist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIPList"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [proxies]
      operationId: deleteProxyAuthIP
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthIPRequest"
      responses:
        "200":
          description: updated whitelist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthIPList"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/proxies/{proxy_id}/ports:
    post:
      tags: [proxies]
      operationId: setProxyPorts
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProxyPolicy"
      responses:
        "202":
          description: port policy accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/OpInProgress"

  /api/v1/proxies/{proxy_id}/enable:
    post:
      tags: [proxies]
      operationId: setProxyEnabled
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnableRequest"
      responses:
        "200":
          description: proxy patched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proxy"

  /api/v1/proxies/{proxy_id}/customer:
    post:
      tags: [proxies]
      operationId: assignProxyCustomer
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignCustomerRequest"
      responses:
        "200":
          description: proxy patched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proxy"

  /api/v1/proxies/{proxy_id}/selftest:
    post:
      tags: [proxies]
      operationId: selftestProxy
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      responses:
        "200":
          description: selftest result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelftestResult"

  /api/v1/slots:
    get:
      tags: [dongles]
      operationId: listSlots
      responses:
        "200":
          description: slot list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotList"

  /api/v1/dongles:
    get:
      tags: [dongles]
      operationId: listDongles
      responses:
        "200":
          description: dongle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DongleList"

  /api/v1/dongles/{dongle_id}:
    get:
      tags: [dongles]
      operationId: getDongle
      parameters:
        - $ref: "#/components/parameters/DongleID"
      responses:
        "200":
          description: dongle detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DongleDetail"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [dongles]
      operationId: patchDongle
      parameters:
        - $ref: "#/components/parameters/DongleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonglePatchRequest"
      responses:
        "200":
          description: dongle patched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dongle"

  /api/v1/dongles/{dongle_id}/reboot:
    post:
      tags: [dongles]
      operationId: rebootDongle
      parameters:
        - $ref: "#/components/parameters/DongleID"
      responses:
        "202":
          description: reboot accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/OpInProgress"

  /api/v1/dongles/{dongle_id}/netmode:
    post:
      tags: [dongles]
      operationId: setDongleNetMode
      parameters:
        - $ref: "#/components/parameters/DongleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetModeRequest"
      responses:
        "202":
          description: net mode change accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/OpInProgress"

  /api/v1/dongles/{dongle_id}/lanip:
    post:
      tags: [dongles]
      operationId: setDongleLanIP
      parameters:
        - $ref: "#/components/parameters/DongleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LanIPRequest"
      responses:
        "202":
          description: lan ip change accepted, expect a re_discovering step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/OpInProgress"

  /api/v1/dongles/{dongle_id}/sms:
    get:
      tags: [dongles]
      operationId: listSms
      parameters:
        - $ref: "#/components/parameters/DongleID"
        - name: box
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SmsBox"
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: size
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: sms page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmsList"

  /api/v1/dongles/{dongle_id}/sms/send:
    post:
      tags: [dongles]
      operationId: sendSms
      parameters:
        - $ref: "#/components/parameters/DongleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsSendRequest"
      responses:
        "204":
          description: queued on the modem

  /api/v1/dongles/{dongle_id}/sms/delete:
    post:
      tags: [dongles]
      operationId: deleteSms
      parameters:
        - $ref: "#/components/parameters/DongleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsIndexRequest"
      responses:
        "204":
          description: deleted

  /api/v1/dongles/{dongle_id}/sms/read:
    post:
      tags: [dongles]
      operationId: markSmsRead
      parameters:
        - $ref: "#/components/parameters/DongleID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsIndexRequest"
      responses:
        "204":
          description: marked read

  /api/v1/operations:
    get:
      tags: [operations]
      operationId: listOperations
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OpKind"
        - name: trigger
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Trigger"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OpState"
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: operation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationList"

  /api/v1/operations/{op_id}:
    get:
      tags: [operations]
      operationId: getOperation
      parameters:
        - name: op_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/rotations:
    get:
      tags: [operations]
      operationId: listRotations
      parameters:
        - name: proxy_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: redacted rotation history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotationList"

  /api/v1/customers:
    get:
      tags: [customers]
      operationId: listCustomers
      responses:
        "200":
          description: customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerList"
    post:
      tags: [customers]
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /api/v1/customers/{customer_id}:
    patch:
      tags: [customers]
      operationId: patchCustomer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          description: patched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /api/v1/keys:
    get:
      tags: [keys]
      operationId: listApiKeys
      responses:
        "200":
          description: api key list, hashes never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
    post:
      tags: [keys]
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiKeyRequest"
      responses:
        "201":
          description: created, secret shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"

  /api/v1/keys/{key_id}:
    delete:
      tags: [keys]
      operationId: revokeApiKey
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: revoked

  /api/v1/keys/{key_id}/link-tokens:
    post:
      tags: [keys]
      operationId: createLinkToken
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: created, url shown exactly once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkTokenCreated"

  /api/v1/link-tokens/{token_id}:
    delete:
      tags: [keys]
      operationId: revokeLinkToken
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: revoked independently of the api key

  /api/v1/events:
    get:
      tags: [events]
      operationId: events
      description: >-
        Server-sent events. No replay: the stream opens with a hello event and the client
        refetches its queries on every reconnect. nginx must disable proxy buffering and the
        response carries X-Accel-Buffering no.
        Frame names are hello, proxy.patch, dongle.patch, op.update, op.done, sms.received and
        system.notice, plus a transport level ping every 25s carrying PingEvent. The ping is what
        turns a half open TCP connection into a real EventSource error instead of a farm that
        merely looks quiet. When the session cookie expires mid stream the server writes an SSE
        comment and closes; the browser reconnects, is answered 401, and the panel falls back to
        its sign in screen.
      parameters:
        - name: topics
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: event stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/rotate/{proxy_id}:
    post:
      tags: [customer-api]
      operationId: rotateProxyCustomer
      description: >-
        Asynchronous by default: 202 with an operation id and a poll url. wait=true blocks
        for at most 90s and returns the terminal result. A rotation that completes without
        changing the public IP is result unchanged with ip_changed false.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProxyID"
        - name: wait
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: terminal result when wait=true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateResult"
        "202":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/OpInProgress"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/status/{proxy_id}:
    get:
      tags: [customer-api]
      operationId: customerStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProxyID"
      responses:
        "200":
          description: customer visible status, never exposes dongle_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerStatus"
        "401":
          $ref: "#/components/responses/Error"

  /r/{link_token}:
    get:
      tags: [customer-api]
      operationId: linkConfirmPage
      description: >-
        Renders a confirmation page. GET has no side effect because link scanners and
        prefetchers do not send any identifying header.
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: confirmation page
          content:
            text/html:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [customer-api]
      operationId: linkRotate
      parameters:
        - $ref: "#/components/parameters/LinkToken"
      responses:
        "200":
          description: terminal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateResult"
        "202":
          description: accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "409":
          $ref: "#/components/responses/OpInProgress"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-dongled_session
      description: >-
        SameSite=Strict, HttpOnly, Secure. Every request that is not GET, HEAD or OPTIONS must
        also carry the header X-CSRF-Token holding Session.csrf_token. POST /auth/login is exempt
        because no session exists yet, and POST /auth/logout is exempt because a forged sign out
        is not worth breaking a client that has not yet read its session.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token

  parameters:
    ProxyID:
      name: proxy_id
      in: path
      required: true
      schema:
        type: string
    DongleID:
      name: dongle_id
      in: path
      required: true
      schema:
        type: string
    LinkToken:
      name: link_token
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OpInProgress:
      description: another operation already runs on this subject
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpInProgress"
    RateLimited:
      description: >-
        rate limited. Retry-After and Error.retry_after always carry the same number of seconds,
        so a client may read either. Per key limits also set the X-RateLimit headers; the per proxy
        minimum rotation interval does not, because it is a product policy rather than a quota.
      headers:
        Retry-After:
          schema:
            type: integer
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ErrorCode:
      type: string
      description: >-
        Stable machine readable reason. sim_pin_required is what a client matches to tell the
        operator to unlock the SIM; rate_limited always comes with Retry-After; op_in_progress
        always comes with operation_id.
      enum:
        - unauthorized
        - invalid_credentials
        - csrf_invalid
        - forbidden
        - scope_missing
        - key_revoked
        - not_found
        - invalid_request
        - payload_too_large
        - op_in_progress
        - conflict
        - rate_limited
        - sim_pin_required
        - device_unreachable
        - degraded
        - proxy_expired
        - not_implemented
        - method_not_allowed
        - timeout
        - internal

    Error:
      type: object
      required: [error, message]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        request_id:
          type: string
        retry_after:
          type: integer

    OpInProgress:
      type: object
      required: [error, operation_id]
      properties:
        error:
          type: string
          enum: [op_in_progress]
        operation_id:
          type: string
        poll_url:
          type: string

    Health:
      type: object
