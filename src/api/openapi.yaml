        Handle for revoking a rotate link. The id is not the secret: the secret lives only in
        LinkTokenCreated.url, is shown exactly once, and is stored hashed. A link token is revoked
        independently of the api key that issued it, so a URL pasted into a chat can be killed
        without rotating the key.
      required: [id, api_key_id, created_at]
      properties:
        id:
          type: string
        api_key_id:
          type: string
        revoked_at:
          type: integer
          nullable: true
        created_at:
          type: integer

