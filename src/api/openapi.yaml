          type: integer
        conn_limit:
          type: integer

    AuthMode:
      type: string
      enum: [userpass, iplist, both]

    ProxyState:
      type: string
      enum: [active, suspended, disabled, expired, degraded, unknown]

    OpKind:
      type: string
      enum: [rotate, reboot, set_auth, set_ports, set_lan_ip, set_net_mode, enroll, selftest]

    OpState:
      type: string
      enum: [pending, running, stalled, succeeded, failed, canceled]

    Trigger:
      type: string
      enum: [admin_ui, customer_api, auto_recovery]

    RotationResult:
      type: string
      enum: [changed, unchanged, failed]

    NetMode:
      type: string
      enum: [auto, 2g, 3g, lte]

    SmsBox:
      type: integer
      enum: [1, 2, 3]

    ConnStatus:
      type: integer
      enum: [900, 901, 902, 903]

    SimState:
      type: integer
      description: >-
        255 no SIM, 256 CPIN error, 257 ready, 258 PIN disabled, 259 PIN checking, 260 PIN
        required, 261 PUK required. Mirrors device.SimState; 259, 260 and 261 mean locked.
      enum: [255, 256, 257, 258, 259, 260, 261]

    Scope:
      type: string
      description: >-
        Permission carried by an API key. rotate allows POST /api/v1/rotate/{proxy_id} and a
        rotate link; status allows GET /api/v1/status/{proxy_id}. Sent as plain strings in
        ApiKeyRequest.scopes so a future scope does not break an older client at compile time.
      enum: [rotate, status]

    OpStep:
      type: string
      description: >-
        Every step name any operation kind can report in Operation.step. Rotate walks precheck,
        fence, data_off, hold, data_on, wait_connect, unfence, verify, done. Reboot walks precheck,
        reboot, wait_down, wait_up, data_on, verify, done. set_net_mode walks precheck, data_off,
        wait_disconnect, set_mode, data_on, wait_connect, verify, done. set_lan_ip walks precheck,
        write_netcfg, post_dhcp, re_discovering, verify, done. Operation.step stays a plain string
        so a client renders an unknown step instead of failing on it.
      enum:
        - precheck
        - fence
        - data_off
        - hold
        - data_on
        - wait_connect
        - unfence
        - verify
        - done
        - reboot
        - wait_down
        - wait_up
        - wait_disconnect
        - set_mode
        - write_netcfg
        - post_dhcp
        - re_discovering

