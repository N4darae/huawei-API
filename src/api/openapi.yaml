    OperationResult:
      type: object
      description: >-
        Terminal payload of an operation, shaped by its kind. A rotate carries result, ip_changed,
        old_ip, new_ip, duration_ms, attempts, hold_ms and conns_killed; old_public_ip and
        new_public_ip are the same two addresses under the names the rotations table uses and are
        emitted alongside them. reboot and set_net_mode carry duration_ms and the state they
        settled on; set_lan_ip carries the gateway and whether the dongle supported the change;
        selftest carries the SelftestResult fields. Additional properties stay open so a new
        operation kind does not break an older client.
      additionalProperties: true
      properties:
        result:
          $ref: "#/components/schemas/RotationResult"
        ip_changed:
          type: boolean
        old_ip:
          type: string
        new_ip:
          type: string
        old_public_ip:
          type: string
        new_public_ip:
          type: string
        duration_ms:
          type: integer
        attempts:
          type: integer
        hold_ms:
          type: integer
        conns_killed:
          type: integer
        reason:
          type: string
        note:
          type: string
        reboot_operation_id:
          type: string
        error:
          type: string

    OperationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Operation"

