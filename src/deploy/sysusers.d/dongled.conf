# systemd-sysusers input for dongled. Install to /etc/sysusers.d/dongled.conf
# and apply with:  systemd-sysusers
#
# The gid is not negotiable: the nft egress chain matches `meta skgid 6100`
# numerically, and 3proxy's own `setgid` line is rendered from the same
# constant. A different gid means every proxy is either unfiltered or dark.
# Each slot N gets uid 6100+N so that the `uidrange` ip rule for slot N is a
# single uid, and `User=pxNN` in dongled-proxy@.service agrees with `setuid`
# in the rendered 3proxy config. Those two disagreeing is the classic
# "process alive, zero listeners" failure.
#
# These accounts have no home and no shell on purpose. They exist only to
# carry a uid for policy routing.

g dongled 6100

u px01 6101:6100 "dongled proxy slot 01" /nonexistent /usr/sbin/nologin
u px02 6102:6100 "dongled proxy slot 02" /nonexistent /usr/sbin/nologin
u px03 6103:6100 "dongled proxy slot 03" /nonexistent /usr/sbin/nologin
