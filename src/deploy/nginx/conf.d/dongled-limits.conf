# Install to /etc/nginx/conf.d/dongled-limits.conf.
#
# NEVER edit /etc/nginx/nginx.conf for dongled. On Debian and Ubuntu the stock
# nginx.conf already contains `include /etc/nginx/conf.d/*.conf;` inside the
# http block, which is where the zones below belong. Everything dongled needs
# in the http context lives in this one file, so uninstalling is `rm`.
#
# Apply with:
#
#   nginx -t && systemctl reload nginx
#
# Always `reload`, never `restart`. A restart drops every in-flight connection
# on a host that is probably also serving something else.

# --- rate limit zones -------------------------------------------------------

# Admin and customer API. 10r/s with a burst absorbs a panel page that fires a
# dozen queries at once without letting a script hammer the box.
limit_req_zone $binary_remote_addr zone=dongled_api:10m rate=10r/s;

# Rotation is expensive: it takes a modem off the air for up to 40 seconds.
# This is a second line of defence only; the real per-proxy min_interval is
# enforced in the application, because nginx cannot see which proxy is being
# rotated.
limit_req_zone $binary_remote_addr zone=dongled_rotate:10m rate=1r/s;

# Login attempts.
limit_req_zone $binary_remote_addr zone=dongled_auth:10m rate=1r/s;

limit_conn_zone $binary_remote_addr zone=dongled_conn:10m;

limit_req_status 429;
limit_conn_status 429;

# --- server block template --------------------------------------------------
#
# A `location` is only legal inside a `server`, and the server block belongs to
# whatever site the operator already runs. Copy the block below into your own
# site config. The `/api/v1/events` part is not optional.
#
# WHY /api/v1/events NEEDS ITS OWN LOCATION
#
# Server-Sent Events is a response that never ends. With nginx's default
# proxy_buffering on, nginx holds every event in its buffer waiting for a
# response body that never completes, so the browser receives nothing. The page
# looks like it loaded and then simply never updates. Nothing is logged, by
# nginx or by dongled: from both sides the connection is healthy. This gets
# discovered days later, always by a customer.
#
# proxy_buffering off is half the fix; the X-Accel-Buffering: no header that
# dongled already sets is the other half, and it only works if nginx is allowed
# to see it (do not add `proxy_ignore_headers X-Accel-Buffering`).
#
#   server {
#       listen 443 ssl http2;
#       server_name panel.example.com;
#
#       # ssl_certificate ... ;
#       # ssl_certificate_key ... ;
#
#       client_max_body_size 2m;
#
#       location / {
#           limit_req  zone=dongled_api burst=20 nodelay;
#           limit_conn dongled_conn 32;
#
#           proxy_pass http://127.0.0.1:8788;
#           proxy_http_version 1.1;
#           proxy_set_header Host              $host;
#           proxy_set_header X-Real-IP         $remote_addr;
#           proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           proxy_read_timeout 65s;
#       }
#
#       location = /api/v1/events {
#           proxy_pass http://127.0.0.1:8788;
#           proxy_http_version 1.1;
#           proxy_set_header Host              $host;
#           proxy_set_header X-Real-IP         $remote_addr;
#           proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           proxy_set_header Connection        "";
#
#           # The four lines that keep SSE alive.
#           proxy_buffering    off;
#           proxy_cache        off;
#           gzip               off;
#           chunked_transfer_encoding off;
#
#           # An SSE stream is idle between events. Anything shorter than the
#           # server's keepalive comment interval closes it every few minutes.
#           proxy_read_timeout 1h;
#           proxy_send_timeout 1h;
#       }
#
#       location ~ ^/api/v1/rotate/ {
#           limit_req zone=dongled_rotate burst=5 nodelay;
#
#           proxy_pass http://127.0.0.1:8788;
#           proxy_http_version 1.1;
#           proxy_set_header Host              $host;
#           proxy_set_header X-Real-IP         $remote_addr;
#           proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#
#           # ?wait=true blocks for up to 90 seconds by contract.
#           proxy_read_timeout 120s;
#       }
#
#       location = /api/v1/auth/login {
#           limit_req zone=dongled_auth burst=5 nodelay;
#
#           proxy_pass http://127.0.0.1:8788;
#           proxy_set_header Host              $host;
#           proxy_set_header X-Real-IP         $remote_addr;
#           proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#       }
#   }
#
# The panel binds 127.0.0.1:8788 and the metrics endpoint binds 127.0.0.1:9788.
# Neither is ever exposed directly; do not proxy_pass to 9788 from a public
# server block.
