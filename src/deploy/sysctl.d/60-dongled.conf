# dongled sysctl drop-in. Install to /etc/sysctl.d/60-dongled.conf.
#
# Read this before adding anything. This file lands on a machine that may also
# run other people's production services, so every line here is either required
# by the routing design or it does not belong.
#
# WHY ONLY THE `default.` PREFIX
#
# rp_filter is evaluated per interface as max(conf.all.rp_filter,
# conf.<iface>.rp_filter). We create up to 48 interfaces, and every one of them
# has a deliberately asymmetric return path: packets arrive on dgNN but the
# route back lives in table 100N, not in `main`. Strict (1) reverse path
# filtering drops them and the symptom is a silent timeout.
#
# Setting `conf.default.rp_filter = 2` gives every *newly created* interface
# loose mode, which covers every dgNN we will ever make, and touches nothing
# that already exists.
#
# We deliberately do NOT set the `conf.all.` variant of rp_filter here. That
# knob is global and shared with whatever else runs on the box. Debian and
# Ubuntu already ship it as 2 in /usr/lib/sysctl.d/50-default.conf, so on a
# stock host the requirement is already met. `dongled preflight` VERIFIES that
# the all. value is 2 and turns red if it is not; fixing it is an explicit
# operator decision, not something an installer does behind your back.
#
# WHAT IS DELIBERATELY MISSING
#
# The TCP retransmit retry limit (net.ipv4.tcp_retries<N>, the one whose default
# of 15 means a dead peer takes 13-30 minutes to fail) is NOT here. Lowering it
# makes a dead dongle's sockets give up faster, which is genuinely useful for
# us, but it is a *global* change that shortens the failure timeout of every TCP
# connection on the host, including databases and application servers that
# belong to someone else. It is written up as an opt-in procedure in
# docs/OPERATIONS.md section 7, with the list of services it affects. The
# Makefile lint refuses to let it back into deploy/, on purpose.

# Loose reverse path filtering for every interface we create from now on.
net.ipv4.conf.default.rp_filter = 2

# This host proxies, it does not route. Forwarding would let a customer use a
# dongle leg to reach the LAN behind another dongle.
net.ipv4.ip_forward = 0

# ICMP redirects have no legitimate use here and would rewrite our per-slot
# routing decisions from the network.
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.default.accept_source_route = 0

# 48 proxies each holding a few hundred customer connections plus the matching
# egress connections. The distro default of 65536 is reached at moderate load
# and conntrack table overflow shows up as random connection failures.
net.netfilter.nf_conntrack_max = 262144

# Accept queue depth for the 96 listeners.
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# 48 gateways plus their neighbours; the default gc_thresh1 of 128 is tight
# once every slot is populated.
net.ipv4.neigh.default.gc_thresh1 = 512
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
