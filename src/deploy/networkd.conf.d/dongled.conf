# Install to /etc/systemd/networkd.conf.d/dongled.conf, then:
#
#   systemctl restart systemd-networkd     (farm host only, at install time)
#
# THIS FILE IS THE DIFFERENCE BETWEEN A WORKING FARM AND AN OUTAGE.
#
# systemd-networkd defaults ManageForeignRoutingPolicyRules to yes. That means
# networkd considers every `ip rule` it did not create itself to be stale
# configuration and removes it on `networkctl reconfigure`, on a daemon reload,
# and on some link events.
#
# The single most important rule in this system is created once at boot and
# never touched again:
#
#   ip rule add from <public_ip> iif lo lookup main priority 900
#
# It is what makes the SYN-ACK to a paying customer leave through the public
# interface instead of down a dongle. Without it the customer's TCP handshake
# never completes: no RST, no log line in 3proxy, no SYN-RECV visible in `ss`,
# just a hang. Letting networkd delete that rule takes down every customer
# connection on the box at a moment nobody will connect to a networkd reload.
#
# ManageForeignRoutes=no is here for the same reason one level down: the
# per-slot default route lives in table 100N, which networkd did not author.

[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
ManageForeignNextHops=no
